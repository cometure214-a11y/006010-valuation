name: 净值更新监控与通知

on:
  schedule:
    # 中国时间 19:00-23:55 每5分钟（GitHub cron 用 UTC：+8 → 11:00-15:55）
    # 净值通常在中国时间 19:30-22:00 公布
    # 分钟/小时/日/月/周几：*/5 表示每5分钟；1-5 表示周一至周五
    - cron: '*/5 11-15 * * 1-5'
  workflow_dispatch:   # 也支持手动触发检查

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 检查净值是否更新（仅调用一次）
        id: check
        run: |
          python scripts/nav_watch.py --check > /tmp/nav_out.txt 2>&1
          cat /tmp/nav_out.txt
          UPDATED=$(grep -oP 'updated=\K[0-9]' /tmp/nav_out.txt || echo 0)
          echo "updated=$UPDATED" >> $GITHUB_OUTPUT
          echo "nav_info=$(cat /tmp/nav_out.txt | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: 安装依赖
        if: steps.check.outputs.updated == '1'
        run: python -m pip install -q -r deploy/requirements.txt

      - name: 跑完整模型并生成页面
        if: steps.check.outputs.updated == '1'
        run: |
          python scripts/fetch_cloud.py
          python src/fund_holdings_infer.py
          python src/fund_valuation_v2.py
          python scripts/gen_static.py

      - name: 提交并推送更新后的数据
        if: steps.check.outputs.updated == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git add -f cache/last_nav.json cache/result.json cache/infer.json
          git diff --staged --quiet || git commit -m "净值更新 $(date -u +%Y-%m-%dT%H:%M)"
          git push

      - name: 配置 Pages
        if: steps.check.outputs.updated == '1'
        uses: actions/configure-pages@v5

      - name: 上传静态页
        if: steps.check.outputs.updated == '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 部署到 GitHub Pages
        id: deployment
        if: steps.check.outputs.updated == '1'
        uses: actions/deploy-pages@v4

      - name: Server酱推送通知
        if: steps.check.outputs.updated == '1'
        env:
          SCKEY: ${{ secrets.SCKEY }}
        run: python scripts/notify.py "$SCKEY"
