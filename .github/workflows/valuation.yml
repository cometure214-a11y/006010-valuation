name: 006010 盘中估值部署

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'fetch_cloud.py'
      - 'fund_valuation_v2.py'
      - 'fund_holdings_infer.py'
      - 'gen_static.py'
      - 'requirements.txt'
  workflow_dispatch:   # 手动触发：完整跑模型后部署

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # bot 提交的 push 跳过（避免手动触发→bot push→再次部署的冗余循环）
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 手动触发时（workflow_dispatch）：抓数据 + 跑双模型 + 生成页面
      # push 触发时：直接部署已推送的 docs/（不重跑，省分钟数）
      - name: 配置 Python（仅手动触发时）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖（仅手动触发时）
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 抓取数据（仅手动触发时）
        if: github.event_name == 'workflow_dispatch'
        run: python fetch_cloud.py

      - name: 方案B 个股反推（仅手动触发时）
        if: github.event_name == 'workflow_dispatch'
        run: python fund_holdings_infer.py

      - name: 方案A v3 多模型估值（仅手动触发时）
        if: github.event_name == 'workflow_dispatch'
        run: python fund_valuation_v2.py

      - name: 生成静态页面（仅手动触发时）
        if: github.event_name == 'workflow_dispatch'
        run: python gen_static.py

      - name: 提交更新后的数据（仅手动触发时）
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git add -f cache/result.json cache/infer.json
          git diff --staged --quiet || git commit -m "更新估值数据 $(date -u +%Y-%m-%dT%H:%M)"
          git push

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传静态页
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
